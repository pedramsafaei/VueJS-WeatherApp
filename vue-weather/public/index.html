<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Professional weather application with real-time forecasts, multiple locations, and detailed weather metrics">
    <meta name="keywords" content="weather, forecast, temperature, climate, meteorology">
    <meta name="author" content="Pedram Safaei">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Weather Pro - Professional Weather Application">
    <meta property="og:description" content="Get accurate weather forecasts for any location worldwide">
    <meta property="og:image" content="<%= BASE_URL %>img/og-image.png">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Weather Pro - Professional Weather Application">
    <meta name="twitter:description" content="Get accurate weather forecasts for any location worldwide">
    <meta name="twitter:image" content="<%= BASE_URL %>img/twitter-image.png">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Weather Pro">
    <link rel="apple-touch-icon" href="<%= BASE_URL %>img/icons/apple-touch-icon.png">
    <link rel="manifest" href="<%= BASE_URL %>manifest.json">
    
    <title>Weather Pro - Professional Weather Application</title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but Weather Pro doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
