version: '3.8'

services:
  weather-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-pro
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service
  weather-app-dev:
    image: node:18-alpine
    container_name: weather-pro-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8081:8080"
    command: sh -c "npm install && npm run serve"
    environment:
      - NODE_ENV=development
    profiles:
      - dev
